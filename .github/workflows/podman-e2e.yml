name: podman-e2e

# P2 of PODMAN.md: exercise the fork against the supported Podman versions.
# The e2e binary is built statically on the runner and executed inside a
# throwaway Incus VM, so the guest has a real kernel and systemd and no
# privileged-container workarounds are needed. Every version runs in both
# rootless and rootful modes; known engine gaps are excluded in the script.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Manual only: run on demand from the Actions tab. The nightly/upstream sync
  # (sync-upstream.yml) has its own e2e job for the rebased overlay.
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: podman-4.3-debian-12-rootless
            image: "images:debian/bookworm"
            storage: overlay
            rootless: "1"
          - name: podman-4.3-debian-12-rootful
            image: "images:debian/bookworm"
            storage: overlay
            rootless: "0"
          - name: podman-4.9-ubuntu-24.04-rootless
            image: "images:ubuntu/noble"
            storage: overlay
            rootless: "1"
          - name: podman-4.9-ubuntu-24.04-rootful
            image: "images:ubuntu/noble"
            storage: overlay
            rootless: "0"
          - name: podman-current-fedora-rootless
            image: "images:fedora/45"
            storage: overlay # the VM's real filesystem avoids the container's nested-overlay limit
            rootless: "1"
          - name: podman-current-fedora-rootful
            image: "images:fedora/45"
            storage: overlay # the VM's real filesystem avoids the container's nested-overlay limit
            rootless: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          make build GO_BUILDTAGS="e2e standalone"
          make example-provider
          go test -c -tags "e2e standalone" -o bin/e2e.test ./pkg/e2e

      - name: Install Incus
        run: |
          test -c /dev/kvm
          curl -fsSL https://pkgs.zabbly.com/get/incus-stable | sudo sh
          sudo apt-get install -y qemu-system-x86 ovmf
          sudo nft flush ruleset || true
          sudo incus admin init --minimal
          sudo incus remote add images https://images.linuxcontainers.org --protocol simplestreams || true

      - name: Run e2e against ${{ matrix.name }}
        env:
          IMAGE: ${{ matrix.image }}
          STORAGE_DRIVER: ${{ matrix.storage }}
          E2E_BIN: ${{ github.workspace }}/bin/build/docker-compose
          E2E_ROOTLESS: ${{ matrix.rootless }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash .github/scripts/podman-e2e-vm.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.name }}
          path: artifacts
          if-no-files-found: ignore
