name: podman-e2e

# P2 of PODMAN.md: exercise the fork against the supported Podman versions.
# The e2e binary is built statically on the runner and executed inside a
# privileged container, so Podman 4.3/4.9 can be tested without host
# compatibility constraints. Known engine gaps are excluded in the script.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - podman
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: podman-4.3-debian-12
            image: debian:12
            storage: overlay
          - name: podman-4.9-ubuntu-24.04
            image: ubuntu:24.04
            storage: overlay
          - name: podman-current-fedora
            image: fedora:latest
            storage: vfs # buildah on Fedora 45 rejects an overlay over the build context
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          make build GO_BUILDTAGS="e2e standalone"
          go test -c -tags "e2e standalone" -o bin/e2e.test ./pkg/e2e

      - name: Run e2e against ${{ matrix.name }}
        env:
          IMAGE: ${{ matrix.image }}
          STORAGE_DRIVER: ${{ matrix.storage }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker run --rm --privileged \
            -v "$PWD:$PWD" -w "$PWD" \
            -e E2E_BIN="$PWD/bin/build/docker-compose" \
            -e STORAGE_DRIVER \
            -e DOCKERHUB_USERNAME -e DOCKERHUB_TOKEN \
            "$IMAGE" bash "$PWD/.github/scripts/podman-e2e.sh"
