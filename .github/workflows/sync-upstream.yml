name: sync-upstream

# Detects a new docker/compose release, rebases the Podman overlay (the
# `podman` release branch) onto it, and runs the unit and e2e suites. Only when
# both pass does it push `podman` and publish a GitHub release from an
# annotated tag on the CI tip; a failed rebase or test leaves `podman` and the
# releases untouched and files an issue. The rebase recipe, commit layout and
# overlay index live in PODMAN.md.

permissions:
  contents: read # every job only reads by default

concurrency:
  group: sync-upstream
  cancel-in-progress: false

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the synced branch
      issues: write # report rebase conflicts
    outputs:
      new: ${{ steps.detect.outputs.new }}
      tag: ${{ steps.detect.outputs.latest }}
      branch: ${{ steps.rebase.outputs.branch }}
      base: ${{ steps.rebase.outputs.base }}
    env:
      UPSTREAM_REPO: docker/compose
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout podman
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: podman
          fetch-depth: 0

      - name: Detect new upstream release
        id: detect
        run: |
          latest=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)
          # Keep upstream tags in their own namespace: fork release tags use the
          # same vX.Y.Z names and must not be overwritten locally.
          upstream_ref="refs/upstream-tags/${latest}"
          git fetch --force "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${latest}:${upstream_ref}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "${upstream_ref}^{commit}" HEAD; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "podman already contains ${latest}"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Upstream released ${latest}; podman does not contain it yet"
          fi

      - name: Set up Go
        if: steps.detect.outputs.new == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Rebase podman onto upstream
        id: rebase
        if: steps.detect.outputs.new == 'true'
        env:
          TAG: ${{ steps.detect.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream_ref="refs/upstream-tags/${TAG}"
          branch="sync/upstream-${TAG}"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          git switch -c "${branch}"
          # Fold fixup! commits into their ci(podman) / baseline targets so a
          # fix does not need a manual interactive rebase.
          if ! GIT_SEQUENCE_EDITOR=: GIT_EDITOR=: git rebase -i --autosquash --no-keep-empty "${upstream_ref}"; then
            git rebase --abort || true
            title="Upstream ${TAG} rebase conflicts"
            if ! gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[].title' | grep -Fxq "${title}"; then
              # gh issue create goes through GraphQL, which rejects the Actions
              # token even with issues: write; the REST endpoint accepts it.
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="${title}" \
                -f body="Automatic rebase onto ${TAG} failed. Resolve it locally following the rebase recipe in PODMAN.md, then close this issue. No release was made." \
                >/dev/null || echo "::warning::Could not create the rebase-conflict issue"
            fi
            {
              echo "### Rebase onto ${TAG} failed"
              echo "Resolve the conflicts locally following PODMAN.md. No release was made."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify overlay commit layout
        if: steps.detect.outputs.new == 'true'
        env:
          TAG: ${{ steps.detect.outputs.latest }}
        run: |
          upstream_ref="refs/upstream-tags/${TAG}"
          subjects=$(git log --format=%s "${upstream_ref}..HEAD")
          tip=$(printf '%s\n' "$subjects" | head -n1)
          ci_count=$(printf '%s\n' "$subjects" | grep -c '^ci(podman):' || true)
          baseline='docs(podman): refresh the full-suite baseline'
          baseline_count=$(printf '%s\n' "$subjects" | grep -Fxc "$baseline" || true)
          if [ "$ci_count" -ne 1 ] || ! printf '%s\n' "$tip" | grep -q '^ci(podman):'; then
            echo "::error::The overlay tip must be its single ci(podman): commit; got '${tip}'."
            exit 1
          fi
          if [ "$baseline_count" -ne 1 ]; then
            echo "::error::The overlay must contain exactly one '${baseline}' commit; found ${baseline_count}."
            exit 1
          fi
          second=$(printf '%s\n' "$subjects" | sed -n '2p')
          if [ "$second" != "$baseline" ]; then
            echo "::error::The baseline commit must sit directly below the ci(podman): commit; got '${second}'."
            exit 1
          fi
          echo "Overlay layout OK: ${ci_count} CI commit, baseline second."

      - name: Unit tests
        if: steps.detect.outputs.new == 'true'
        run: go test ./pkg/...

      - name: Build e2e binaries
        if: steps.detect.outputs.new == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          make build GO_BUILDTAGS="e2e standalone"
          make example-provider
          go test -c -tags "e2e standalone" -o bin/e2e.test ./pkg/e2e

      - name: Upload e2e binaries
        if: steps.detect.outputs.new == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-binaries
          path: bin
          if-no-files-found: error

      - name: Push synced branch
        if: steps.detect.outputs.new == 'true'
        env:
          BRANCH: ${{ steps.rebase.outputs.branch }}
        run: |
          remote_sha=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | cut -f1)
          git push --force-with-lease="refs/heads/${BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${BRANCH}"

  e2e:
    name: e2e (${{ matrix.name }})
    needs: sync
    if: needs.sync.outputs.new == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: podman-4.3-debian-12-rootless
            image: debian:12
            storage: overlay
            rootless: "1"
          - name: podman-4.3-debian-12-rootful
            image: debian:12
            storage: overlay
            rootless: "0"
          - name: podman-4.9-ubuntu-24.04-rootless
            image: ubuntu:24.04
            storage: overlay
            rootless: "1"
          - name: podman-4.9-ubuntu-24.04-rootful
            image: ubuntu:24.04
            storage: overlay
            rootless: "0"
          - name: podman-current-fedora-rootless
            image: fedora:latest
            storage: vfs # buildah on Fedora 45 rejects an overlay over the build context
            rootless: "1"
          - name: podman-current-fedora-rootful
            image: fedora:latest
            storage: vfs # buildah on Fedora 45 rejects an overlay over the build context
            rootless: "0"
    steps:
      - name: Checkout synced branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.branch }}
          persist-credentials: false

      - name: Download test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-binaries
          path: bin

      - name: Run e2e against ${{ matrix.name }}
        env:
          IMAGE: ${{ matrix.image }}
          STORAGE_DRIVER: ${{ matrix.storage }}
          E2E_ROOTLESS: ${{ matrix.rootless }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          chmod +x bin/build/docker-compose bin/build/example-provider bin/e2e.test
          export E2E_BIN="$PWD/bin/build/docker-compose"
          bash .github/scripts/podman-e2e-container.sh

  release:
    needs:
      - sync
      - e2e
    if: needs.sync.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch ci.yml at the release tag
      contents: write # push podman and the release tag
    env:
      TAG: ${{ needs.sync.outputs.tag }}
      BRANCH: ${{ needs.sync.outputs.branch }}
      BASE: ${{ needs.sync.outputs.base }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout synced branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.branch }}

      - name: Publish podman and release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag the CI tip: ci.yml builds the overlay at the tag, and the
          # annotated tag keeps the CI commit on top of the branch.
          git tag -f -a "${TAG}" -m "Podman overlay release for docker/compose ${TAG}" HEAD
          git push --force-with-lease="refs/heads/podman:${BASE}" origin "HEAD:refs/heads/podman"
          git push --force origin "refs/tags/${TAG}"
          git push origin --delete "${BRANCH}" || true

      - name: Build and publish the release
        run: gh workflow run ci.yml --ref "${TAG}" -f release=true
